# A1: work FAILS, ci needs it with NO if: always()
name: ci
on: pull_request
permissions:
  contents: read
jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: exit 1
  ci:
    needs: [work]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'length > 0 and all(.[]; .result == "success")' <<<"${NEEDS}"
